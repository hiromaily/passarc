name: Lint

on:
  pull_request:
    paths:
      - 'App/**'
      - 'Core/**'
      - 'Extension/**'
      - 'scripts/**'
      - '.swiftformat'
      - 'mise.toml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Core/**'
      - 'Extension/**'
      - 'scripts/**'
      - '.swiftformat'
      - 'mise.toml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.8.14
      - run: mise run lint
