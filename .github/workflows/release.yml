name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select release signing mode
        id: signing
        env:
          REF_TYPE: ${{ github.ref_type }}
          NOTARIZE: ${{ vars.PASSARC_NOTARIZE }}
        run: |
          case "$NOTARIZE" in
            ""|false|true) ;;
            *) echo "::error::PASSARC_NOTARIZE must be true, false, or unset."; exit 1 ;;
          esac
          if [[ "$REF_TYPE" == tag && "$NOTARIZE" == true ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "Signing with Developer ID and notarizing"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "Signing ad hoc"
          fi
      - name: Import Developer ID and prepare notarization
        if: steps.signing.outputs.notarize == 'true'
        env:
          CERTIFICATE: ${{ secrets.PASSARC_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.PASSARC_DEVELOPER_ID_PASSWORD }}
          NOTARY_KEY: ${{ secrets.PASSARC_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.PASSARC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.PASSARC_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?}" "${CERTIFICATE_PASSWORD:?}" "${NOTARY_KEY:?}" "${NOTARY_KEY_ID:?}" "${NOTARY_ISSUER:?}"
          umask 077
          keychain="$RUNNER_TEMP/passarc-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/passarc-signing.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$CERTIFICATE" | base64 -D > "$certificate"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/passarc-notary.p8"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application:/ { print $2; exit }')"
          : "${identity:?No valid Developer ID Application identity found}"
          {
            echo "PASSARC_SIGNING_IDENTITY=$identity"
            echo "PASSARC_NOTARY_KEY=$RUNNER_TEMP/passarc-notary.p8"
          } >> "$GITHUB_ENV"
      - name: Package app and render cask
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
          PASSARC_NOTARY_KEY_ID: ${{ secrets.PASSARC_NOTARY_KEY_ID }}
          PASSARC_NOTARY_ISSUER: ${{ secrets.PASSARC_NOTARY_ISSUER }}
        run: |
          version=0.0.0
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
          fi
          if [[ "$NOTARIZE" == true ]]; then
            : "${PASSARC_SIGNING_IDENTITY:?}" "${PASSARC_NOTARY_KEY:?}"
          fi
          scripts/package-release.sh "$version"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: passarc-release
          path: |
            build/release/PassArc-arm64.zip
            build/release/passarc.rb
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: passarc-release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes PassArc-arm64.zip passarc.rb

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: passarc-homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Check tap credentials
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$TAP_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN is unset. Copy the release's passarc.rb to Casks/passarc.rb in hiromaily/homebrew-tap."
          fi
      - uses: actions/download-artifact@v8.0.2
        if: steps.tap.outputs.enabled == 'true'
        with:
          name: passarc-release
          path: release-assets
      - uses: actions/checkout@v7.0.1
        if: steps.tap.outputs.enabled == 'true'
        with:
          repository: hiromaily/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish cask to tap
        if: steps.tap.outputs.enabled == 'true'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ "$TAG" != "$latest" ]]; then
            echo "Skipping $TAG because $latest is the current release."
            exit 0
          fi
          mkdir -p homebrew-tap/Casks
          cp release-assets/passarc.rb homebrew-tap/Casks/passarc.rb
          cd homebrew-tap
          git add -- Casks/passarc.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update PassArc to $TAG"
          git push
